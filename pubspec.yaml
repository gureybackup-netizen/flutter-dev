name: vardchat
description: "VardChat - End-to-end encrypted messenger"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Appwrite
  appwrite: ^16.0.0

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # WebRTC
  flutter_webrtc: ^0.12.9
  # HTTP
  http: ^1.2.2

  # Call UI
  flutter_callkit_incoming: ^2.0.4

  # Local Notifications
  flutter_local_notifications: ^18.0.1

  # UUID
  uuid: ^4.5.1

  # Encryption
  cryptography: ^2.7.0

  # Time formatting
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  flutter_web_auth_2: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/vardchat_icon_1024.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/vardchat_icon_1024.png"