name: vardchat
description: "VardChat - End-to-end encrypted messenger"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Supabase
  supabase_flutter: ^2.8.0

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # WebRTC
  flutter_webrtc: ^0.12.9

  # Call UI
  flutter_callkit_incoming: ^2.0.4

  # Local Notifications
  flutter_local_notifications: ^18.0.1

  # UUID
  uuid: ^4.5.1

  # Time formatting
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true